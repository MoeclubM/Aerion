# Aerion native server profiles live in one file.
# Select one with: aerion run --config config.server.example.toml --profile anytls

[[servers]]
name = "anytls"
protocol = "anytls"
listen = "0.0.0.0:8443"
password = "change-me"
# Optional extra accepted AnyTLS credentials.
# users = ["uuid-or-password-1", "uuid-or-password-2"]
cert = "server.crt"
key = "server.key"
heartbeat_interval_secs = 30
# Optional AnyTLS-compatible padding scheme.
# padding_scheme = ["stop=8", "0=30-30", "1=100-400"]

[[servers]]
name = "hysteria2"
protocol = "hysteria2"
listen = "0.0.0.0:8444"
password = "change-me"
# Optional extra accepted Hysteria2 auth credentials.
# users = ["uuid-or-password-1", "uuid-or-password-2"]
cert = "server.crt"
key = "server.key"
udp = true
cc_rx = "0"
congestion_control = "bbr"
auth_timeout = 10
# obfs = "salamander"
# obfs_password = "change-me-obfs"

[[servers]]
name = "mieru-tcp"
protocol = "mieru"
listen = "0.0.0.0:8964"
username = "default"
password = "change-me"
# Extra users use "username:password" entries.
users = ["alice:alice-password"]
mtu = 1500
transport = "tcp" # tcp/stream or udp/packet
# Optional base64 protobuf trafficPattern / noncePattern strings from Mieru.
# traffic_pattern = "..."
# nonce_pattern = "..."
user-hint-mandatory = false

[[servers]]
name = "tuic"
protocol = "tuic"
listen = "0.0.0.0:443"
username = "00000000-0000-0000-0000-000000000000"
password = "change-me"
# Optional extra accepted TUIC v5 users in "uuid:password" form.
# users = ["11111111-1111-1111-1111-111111111111:change-me-too"]
cert = "server.crt"
key = "server.key"
udp = true
congestion_control = "cubic"
alpn = ["h3"]
heartbeat_interval_secs = 10

[[servers]]
name = "shadowsocks"
protocol = "shadowsocks"
listen = "0.0.0.0:8388"
cipher = "aes-128-gcm"
password = "change-me"
udp = true
# AEAD-2022 EIH users use "name:base64-user-key" entries.
# users = ["alice:AAAAAAAAAAAAAAAAAAAAAA=="]

[[servers]]
name = "naive-h2"
protocol = "naive"
listen = "0.0.0.0:8449"
username = "default"
password = "change-me"
# Extra users use "username:password" entries.
users = ["alice:alice-password"]
cert = "server.crt"
key = "server.key"
udp_over_tcp = true
# Set transport = "quic" or protocol = "naive+quic" to also bind HTTP/3.
# quic_congestion_control = "bbr"

[[servers]]
name = "trojan"
protocol = "trojan"
listen = "0.0.0.0:8445"
password = "change-me"
# Optional extra accepted Trojan passwords.
# users = ["change-me-too"]
cert = "server.crt"
key = "server.key"

[[servers]]
name = "vless"
protocol = "vless"
listen = "0.0.0.0:8446"
user_id = "00000000-0000-0000-0000-000000000000"
password = ""
# Optional extra accepted VLESS UUIDs.
# users = ["11111111-1111-1111-1111-111111111111"]
cert = "server.crt"
key = "server.key"
flow = "xtls-rprx-vision"
network = "tcp"

[[servers]]
name = "vmess"
protocol = "vmess"
listen = "0.0.0.0:8447"
user_id = "00000000-0000-0000-0000-000000000000"
password = ""
# Optional extra accepted VMess UUIDs.
# users = ["11111111-1111-1111-1111-111111111111"]
tls = true
cert = "server.crt"
key = "server.key"
