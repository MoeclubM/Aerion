[package]
name = "aerion"
version = "0.1.0"
edition = "2024"

[features]
default = ["server-ech"]
# Server-side TLS ECH via BoringSSL (rustls/ring does not support server ECH yet).
# Mobile/library consumers should use `default-features = false` when cross-compiling.
server-ech = ["dep:boring", "dep:tokio-boring"]

[dependencies]
anyhow = "1.0.104"
aes = "0.8.4"
aes-gcm = "0.10.3"
base64 = "0.22.1"
blake2 = "0.10.6"
bytes = "1.12.1"
cipher = "0.4.4"
chacha20poly1305 = "0.10.1"
curve25519-dalek = "4.1.3"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "2.2.0"
getrandom = { version = "0.4.3", features = ["std"] }
h2 = "0.4.20"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
http = "1.5.0"
md-5 = "0.10.6"
quinn = "0.11.12"
rand = "0.9.5"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sha1 = "0.10.7"
shadowsocks = { version = "1.25.0", default-features = false, features = ["aead-cipher", "aead-cipher-extra", "aead-cipher-2022", "aead-cipher-2022-extra"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["early-data"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
webpki-roots = "1.0.10"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
socket2 = "0.6.5"
tun2proxy = { version = "0.7.21", default-features = false }
tproxy-config = { version = "7.0.9", default-features = false }
regex = "1.13.1"
boring = { version = "5.3.0", optional = true }
tokio-boring = { version = "5.3.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
