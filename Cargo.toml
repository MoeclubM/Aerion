[package]
name = "aerion"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
blake2 = "0.10"
bytes = "1"
cipher = "0.4"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
getrandom = "0.3"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
md-5 = "0.10"
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sha1 = "0.10"
shadowsocks = { version = "1.24.0", default-features = false, features = ["aead-cipher", "aead-cipher-extra", "aead-cipher-2022", "aead-cipher-2022-extra", "stream-cipher"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["early-data"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tun2proxy = { version = "0.7.21", default-features = false }
tproxy-config = { version = "^7.0.7", default-features = false }

[dev-dependencies]
tempfile = "3"
