mode = "server"

[server]
protocol = "mieru"
listen = "0.0.0.0:8964"
username = "default"
password = "change-me"
# Extra users use "username:password" entries.
users = ["alice:alice-password"]
mtu = 1500
transport = "tcp" # tcp/stream or udp/packet
# traffic_pattern / nonce_pattern shaping is not implemented yet; setting either
# field fails explicitly instead of being ignored.
user-hint-mandatory = false
