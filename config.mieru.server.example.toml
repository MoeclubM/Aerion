mode = "server"

[server]
protocol = "mieru"
listen = "0.0.0.0:8964"
username = "default"
password = "change-me"
# Extra users use "username:password" entries.
users = ["alice:alice-password"]
mtu = 1500
transport = "tcp" # tcp/stream or udp/packet
# Optional base64 protobuf trafficPattern / noncePattern strings from Mieru.
# traffic_pattern = "..."
# nonce_pattern = "..."
user-hint-mandatory = false
