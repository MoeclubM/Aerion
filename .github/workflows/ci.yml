name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:


jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

  ios-check:
    name: iOS target check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Check iOS device target
        run: cargo check --locked --target aarch64-apple-ios

      - name: Check iOS simulator target
        run: cargo check --locked --target aarch64-apple-ios-sim

  android-check:
    name: Android target check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup target add aarch64-linux-android

      - name: Configure Android NDK clang
        shell: bash
        run: |
          ndk="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          clang="$(find "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" -name 'aarch64-linux-android*-clang' | sort -V | tail -n 1)"
          echo "CC_aarch64_linux_android=$clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Check Android arm64 target
        run: cargo check --locked --target aarch64-linux-android

