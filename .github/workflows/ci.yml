name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      performance_base:
        description: Base revision for benchmark-only run (empty runs full CI)
        required: false
        default: ''
      performance_suite:
        description: Benchmark suite to compare
        type: choice
        options: [codecs, transport, anytls]
        default: codecs


jobs:
  library-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.performance_base == ''
    name: Library protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test without optional server ECH
        run: cargo test --locked --no-default-features
  sudoku-interop:
    if: github.event_name != 'workflow_dispatch' || inputs.performance_base == ''
    name: Official Sudoku interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - run: |
          git clone https://github.com/SUDOKU-ASCII/sudoku.git /tmp/sudoku-upstream
          git -C /tmp/sudoku-upstream checkout 4889b53cb35355123bebd40e6c76a9582de7c23d
          mkdir -p /tmp/sudoku-upstream/cmd/aerion-interop
          cp tests/sudoku_interop/main.go /tmp/sudoku-upstream/cmd/aerion-interop/main.go
          cd /tmp/sudoku-upstream
          go build -o /tmp/sudoku-interop ./cmd/aerion-interop
      - run: cargo test --locked --no-default-features sudoku::tests -- --nocapture
        env:
          SUDOKU_INTEROP_BIN: /tmp/sudoku-interop
  rust:
    if: github.event_name != 'workflow_dispatch' || inputs.performance_base == ''
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake perl pkg-config

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: VMess cipher cache benchmark
        if: runner.os == 'Linux'
        run: cargo test --locked --release --no-default-features cipher_cache_microbenchmark -- --ignored --nocapture

  ios-check:
    if: github.event_name != 'workflow_dispatch' || inputs.performance_base == ''
    name: iOS target check
    runs-on: macos-latest
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install Rust
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Check iOS device target
        run: cargo check --locked --no-default-features --target aarch64-apple-ios

      - name: Check iOS simulator target
        run: cargo check --locked --no-default-features --target aarch64-apple-ios-sim

  android-check:
    if: github.event_name != 'workflow_dispatch' || inputs.performance_base == ''
    name: Android target check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install Rust
        run: rustup target add aarch64-linux-android

      - name: Configure Android NDK clang
        shell: bash
        run: |
          ndk="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          clang="$(find "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" -name 'aarch64-linux-android*-clang' | sort -V | tail -n 1)"
          echo "CC_aarch64_linux_android=$clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Check Android arm64 target
        run: cargo check --locked --no-default-features --target aarch64-linux-android

  protocol-performance:
    name: Protocol performance comparison
    if: github.event_name == 'workflow_dispatch' && inputs.performance_base != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.performance_base }}
          path: .performance-baseline
      - name: Compare release codecs
        run: python3 .github/scripts/protocol_performance.py --suite "${{ inputs.performance_suite }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-performance
          path: performance-results/
