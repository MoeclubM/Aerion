# Aerion native client profiles live in one file.
# Select one with: aerion run --config config.client.example.toml --profile anytls

[[clients]]
name = "anytls"
protocol = "anytls"
listen = "127.0.0.1:1080"
server = "example.com:8443"
password = "change-me"
sni = "example.com"
insecure = false
# ca_cert_paths = ["ca.pem"]
heartbeat_interval_secs = 30
# Optional AnyTLS-compatible padding scheme.
# padding_scheme = ["stop=8", "0=30-30", "1=100-400"]

[[clients]]
name = "hysteria2"
protocol = "hysteria2"
listen = "127.0.0.1:1081"
server = "example.com:8443"
password = "change-me"
sni = "example.com"
insecure = false
udp = true
congestion_control = "bbr"
# download_bandwidth is Mbps and is sent as Hysteria-CC-RX.
# download_bandwidth = 100
# certificate_fingerprint = "sha256:00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
# ca_cert_paths = ["ca.pem"]
# obfs = "salamander"
# obfs_password = "change-me-obfs"

[[clients]]
name = "mieru-tcp"
protocol = "mieru"
listen = "127.0.0.1:1082"
server = "127.0.0.1:8964"
username = "default"
password = "change-me"
mtu = 1400
transport = "tcp" # tcp/stream or udp/packet
# Optional base64 protobuf trafficPattern / noncePattern strings from Mieru.
# traffic_pattern = "..."
# nonce_pattern = "..."

[[clients]]
name = "naive-h2"
protocol = "naive"
listen = "127.0.0.1:1083"
server = "example.com:443"
username = "user"
password = "change-me"
sni = "example.com"
insecure = false
# ca_cert_paths = ["ca.pem"]
# Enable SOCKS5 UDP ASSOCIATE over UOT-style UDP-over-TCP.
udp_over_tcp = false
# Set transport = "quic" or protocol = "naive+quic" for HTTP/3.
transport = "tcp"
# quic_congestion_control = "bbr"

[[clients]]
name = "http-proxy"
protocol = "http"
listen = "127.0.0.1:1090"
server = "example.com:8080"
username = "user"
password = "change-me"
tls = false
# For HTTPS proxy upstreams:
# protocol = "https"
# sni = "example.com"
# ca_cert_paths = ["ca.pem"]
# headers = { X-Aerion = "example" }

[[clients]]
name = "socks-proxy"
protocol = "socks5"
listen = "127.0.0.1:1091"
server = "example.com:1080"
username = "user"
password = "change-me"
udp = true

[[clients]]
name = "tuic"
protocol = "tuic"
listen = "127.0.0.1:1084"
server = "example.com:443"
username = "00000000-0000-0000-0000-000000000000"
password = "change-me"
sni = "example.com"
insecure = false
# ca_cert_paths = ["ca.pem"]
udp = true
udp_relay_mode = "native"
congestion_control = "cubic"
alpn = ["h3"]
heartbeat_interval_secs = 10

[[clients]]
name = "shadowsocks"
protocol = "shadowsocks"
listen = "127.0.0.1:1085"
server = "example.com:8388"
security = "aes-256-gcm"
password = "change-me"
udp = true

[[clients]]
name = "trojan"
protocol = "trojan"
listen = "127.0.0.1:1086"
server = "example.com:443"
password = "change-me"
sni = "example.com"
insecure = false
# ca_cert_paths = ["ca.pem"]
udp = true
client_fingerprint = "chrome"

[[clients]]
name = "vless-reality"
protocol = "vless"
listen = "127.0.0.1:1087"
server = "example.com:443"
user_id = "00000000-0000-0000-0000-000000000000"
password = ""
sni = "www.example.com"
flow = "xtls-rprx-vision"
packet_encoding = "xudp"
client_fingerprint = "chrome"
reality_public_key = "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8"
reality_short_id = "a1b2"

[[clients]]
name = "vless-ws"
protocol = "vless"
listen = "127.0.0.1:1088"
server = "example.com:443"
user_id = "00000000-0000-0000-0000-000000000000"
password = ""
sni = "example.com"
network = "ws"
# ca_cert_paths = ["ca.pem"]
path = "/vless"
host = "edge.example.com"

[[clients]]
name = "vmess-tls"
protocol = "vmess"
listen = "127.0.0.1:1089"
server = "example.com:443"
user_id = "00000000-0000-0000-0000-000000000000"
password = ""
security = "auto"
tls = true
sni = "example.com"
# ca_cert_paths = ["ca.pem"]
udp = true
